  <!-- Карточка подарка крупным планом. Содержимое подставляется из app.js -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-sheet-close></div>

    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__head">
        <span class="sheet__grabber" aria-hidden="true"></span>
      </div>

      <div class="sheet__scroll">
        <div class="sheet__stage">
          <div class="sheet__art" id="sheet-art"></div>
        </div>

        <h2 class="sheet__title" id="sheet-title"></h2>
        <p class="sheet__note" id="sheet-note"></p>

        <dl class="sheet__specs">
          <dt>Наличие</dt>
          <dd>
            <span class="sheet__value">
              <span id="sheet-left"></span>
              <span class="sheet__pill" id="sheet-rest" hidden></span>
            </span>
            <span class="sheet__gauge" id="sheet-gauge" role="img">
              <span class="sheet__gauge-fill" id="sheet-gauge-fill"></span>
            </span>
          </dd>

          <dt>Цена</dt>
          <dd>
            <span class="sheet__value sheet__price">
              <img class="gift__star" src="gifts/star-white.png" alt="звёзд" draggable="false">
              <span class="sheet__amount" id="sheet-price"></span>
            </span>
          </dd>

          <dt>Статус</dt>
          <dd><span class="sheet__value" id="sheet-status"></span></dd>
        </dl>
      </div>

      <div class="sheet__foot">
        <div class="sheet__qty glass">
          <button class="sheet__qty-btn" type="button" id="qty-less" aria-label="Убрать один">&minus;</button>
          <span class="sheet__qty-value" id="qty-value" aria-live="polite">1</span>
          <button class="sheet__qty-btn" type="button" id="qty-more" aria-label="Добавить один">+</button>
        </div>

        <button class="sheet__buy" type="button" id="sheet-buy">
          <span>Купить за</span>
          <img class="sheet__buy-star" src="gifts/star-white.png" alt="" draggable="false">
          <span id="sheet-buy-price"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast glass" id="toast" role="status" aria-live="polite" hidden>
    <svg class="toast__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12.5 10 17.5 19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="toast-text"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
