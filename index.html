<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d10">
  <title>GopsGift</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="stage"></main>

  <!-- Иконки — Lucide 1.52.0 (ISC), сетка 24, штрих 2 -->
  <nav class="nav" role="tablist" aria-label="Разделы">
    <span class="nav__indicator" aria-hidden="true"></span>

    <button class="nav__item is-active" type="button" role="tab" aria-selected="true" data-section="market" aria-label="Маркет">
      <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/>
        <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/>
        <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/>
      </svg>
    </button>

    <button class="nav__item" type="button" role="tab" aria-selected="false" data-section="gifts" aria-label="Подарки">
      <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7v14"/>
        <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
        <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/>
        <rect x="3" y="7" width="18" height="4" rx="1"/>
      </svg>
    </button>

    <button class="nav__item" type="button" role="tab" aria-selected="false" data-section="upgrade" aria-label="Апгрейд">
      <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m17 11-5-5-5 5"/>
        <path d="m17 18-5-5-5 5"/>
      </svg>
    </button>

    <button class="nav__item" type="button" role="tab" aria-selected="false" data-section="profile" aria-label="Профиль">
      <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
