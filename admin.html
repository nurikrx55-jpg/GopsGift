  <!-- Экраны до входа: загрузка, настройка, отказ -->
  <div class="ad-gate" id="gate">
    <div class="ad-gate__card" id="gate-card">
      <span class="ad-spinner" aria-hidden="true"></span>
      <p class="ad-gate__text">Проверяем доступ…</p>
    </div>
  </div>

  <div class="ad" id="ad" hidden>
    <aside class="ad-side" aria-label="Разделы">
      <div class="ad-brand">
        <span class="ad-brand__logo"><svg viewBox="0 0 643 617"><use href="#logo"/></svg></span>
        <span class="ad-brand__text"><b>GopsGift</b><small>Админка</small></span>
      </div>

      <nav class="ad-nav">
          <button class="ad-nav__item" type="button" data-go="overview"><svg class="i"><use href="#i-home"/></svg><span>Обзор</span><b class="ad-nav__count" data-count="overview"></b></button>
          <button class="ad-nav__item" type="button" data-go="gifts"><svg class="i"><use href="#i-gift"/></svg><span>Подарки</span><b class="ad-nav__count" data-count="gifts"></b></button>
          <button class="ad-nav__item" type="button" data-go="banners"><svg class="i"><use href="#i-image"/></svg><span>Баннеры</span><b class="ad-nav__count" data-count="banners"></b></button>
          <button class="ad-nav__item" type="button" data-go="users"><svg class="i"><use href="#i-users"/></svg><span>Люди</span><b class="ad-nav__count" data-count="users"></b></button>
          <button class="ad-nav__item" type="button" data-go="tasks"><svg class="i"><use href="#i-tasks"/></svg><span>Задания</span><b class="ad-nav__count" data-count="tasks"></b></button>
          <button class="ad-nav__item" type="button" data-go="settings"><svg class="i"><use href="#i-settings"/></svg><span>Настройки</span><b class="ad-nav__count" data-count="settings"></b></button>
      </nav>

      <div class="ad-side__foot">
        <a class="ad-side__app" href="index.html"><svg class="i"><use href="#i-back"/></svg>В приложение</a>
        <span class="ad-live"><i></i>Изменения видны всем сразу</span>
      </div>
    </aside>

    <div class="ad-main">
      <header class="ad-top">
        <a class="ad-top__back" href="index.html" aria-label="В приложение"><svg class="i"><use href="#i-back"/></svg></a>
        <div class="ad-top__title">
          <h1 id="top-title">Обзор</h1>
          <p id="top-sub"></p>
        </div>
        <div class="ad-top__acts" id="top-acts"></div>
      </header>

      <main class="ad-view" id="view"></main>
    </div>

    <nav class="ad-bar" aria-label="Разделы">
      <button class="ad-tab" type="button" data-go="overview"><svg class="i"><use href="#i-home"/></svg><span>Обзор</span></button>
      <button class="ad-tab" type="button" data-go="gifts"><svg class="i"><use href="#i-gift"/></svg><span>Подарки</span></button>
      <button class="ad-tab" type="button" data-go="banners"><svg class="i"><use href="#i-image"/></svg><span>Баннеры</span></button>
      <button class="ad-tab" type="button" data-go="users"><svg class="i"><use href="#i-users"/></svg><span>Люди</span></button>
      <button class="ad-tab" type="button" data-go="tasks"><svg class="i"><use href="#i-tasks"/></svg><span>Задания</span></button>
      <button class="ad-tab" type="button" data-go="settings"><svg class="i"><use href="#i-settings"/></svg><span>Настройки</span></button>
    </nav>

  <!-- Лист: на телефоне выезжает снизу, на широком экране стоит по центру -->
  <div class="ad-sheet" id="sheet" hidden>
    <div class="ad-sheet__backdrop" data-close></div>
    <section class="ad-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <span class="ad-sheet__grabber" aria-hidden="true"></span>
      <header class="ad-sheet__head">
        <h2 id="sheet-title"></h2>
        <button class="ad-icon" type="button" data-close aria-label="Закрыть"><svg class="i"><use href="#i-close"/></svg></button>
      </header>
      <div class="ad-sheet__body" id="sheet-body"></div>
      <footer class="ad-sheet__foot" id="sheet-foot"></footer>
    </section>
  </div>

  <div class="ad-toast" id="toast" role="status" aria-live="polite" hidden>
    <svg class="i ad-toast__icon"><use href="#i-check"/></svg>
    <span id="toast-text"></span>
  </div>

  <input type="file" id="picker" hidden>

  <script src="local.js"></script>
  <script src="admin.js"></script>
