# gapsgift.online — домен и TLS держит nginx, приложение слушает петлю.
# Строки с сертификатом дописывает certbot при выпуске.

server {
    listen 80;
    listen [::]:80;
    server_name gapsgift.online www.gapsgift.online;

    # Проверку домена оставляем на http, остальное уводим на https
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://gapsgift.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gapsgift.online;

    ssl_certificate     /etc/letsencrypt/live/gapsgift.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gapsgift.online/privkey.pem;

    return 301 https://gapsgift.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gapsgift.online;

    ssl_certificate     /etc/letsencrypt/live/gapsgift.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gapsgift.online/privkey.pem;

    # Приложение открывают внутри Telegram, то есть во фрейме: запрещать
    # фреймы здесь нельзя, иначе Mini App не откроется вовсе
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Админка шлёт анимацию подарка строкой base64 — она заметно больше файла
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
